[project]
name = "fonliman"
version = "0.1.0"
description = "Tek ekranda izlediğin TEFAS fonlarını takip et."
requires-python = ">=3.11"
license = { file = "../LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "apscheduler>=3.10",
    "requests>=2.32",
    "pydantic>=2.9",
    "holidays>=0.58",
]

[project.scripts]
fonliman = "fonliman.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fonliman"]
